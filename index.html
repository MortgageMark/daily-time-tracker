<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <title>Daily Time Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0b1220; color: #e0e7ff; }
    #login { display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 12px; padding: 32px; width: 100%; max-width: 360px; }
    .title { font-size: 18px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; text-transform: uppercase; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 6px; color: #e0e7ff; font-size: 14px; }
    input:focus { outline: none; border-color: #3b82f6; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 8px; }
    button:hover { background: #2563eb; }
    .error { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; }
    #app { display: none; padding: 20px; }
  </style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="title">⏱️ Daily Time Tracker</div>
    <div class="subtitle">Sign in to sync your time across every device.</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••">
    </div>
    <button id="loginBtn">Sign In</button>
    <div id="error" class="error"></div>
  </div>
</div>

<div id="app">
  <h1>⏱️ Daily Time Tracker</h1>
  <p>Welcome, <span id="userEmail"></span>!</p>
  <button id="logoutBtn">Sign Out</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.addEventListener('load', async function() {
  const sb = window.supabase.createClient(
    'https://vybypyeyzfgakenkotbw.supabase.co',
    'sb_publishable_-aDVEq7DzlUz7hlvpgkUhw_i6yXO2SU',
    { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'dtt-auth' } }
  );

  document.getElementById('loginBtn').addEventListener('click', async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';

    if (!email || !password) {
      errorEl.textContent = 'Please enter email and password';
      return;
    }

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = error.message;
        return;
      }
      document.getElementById('userEmail').textContent = data.user.email;
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    } catch (err) {
      errorEl.textContent = 'Error: ' + (err.message || 'Login failed');
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async function() {
    await sb.auth.signOut();
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  });

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('userEmail').textContent = session.user.email;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }
});
</script>

</body>
</html>
