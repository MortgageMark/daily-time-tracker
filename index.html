<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.json">
  <title>Daily Time Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1220; color: #e0e7ff; line-height: 1.5; }
    #loginGate, #appRoot { display: none; width: 100vw; height: 100vh; }
    #loginGate { flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .login-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 12px; padding: 32px; width: min(100%, 360px); box-shadow: 0 20px 25px rgba(0, 0, 0, 0.3); }
    .login-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .login-subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 6px; color: #e0e7ff; font-size: 14px; transition: all 0.2s; }
    input:focus { outline: none; background: rgba(15, 23, 42, 0.8); border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
    input::placeholder { color: #64748b; }
    .btn { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .btn:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 10px 15px rgba(59, 130, 246, 0.3); }
    .btn:active { transform: translateY(0); }
    .forgot-link { text-align: center; margin-top: 16px; }
    .forgot-link a { color: #3b82f6; text-decoration: none; font-size: 13px; }
    .forgot-link a:hover { text-decoration: underline; }
    .form-hidden { display: none; }
    .back-btn { color: #3b82f6; cursor: pointer; font-size: 13px; margin-bottom: 16px; text-decoration: underline; }
    .status-msg { text-align: center; margin-top: 12px; font-size: 13px; color: #f87171; }
    .success-msg { color: #4ade80; }
    #appRoot { position: relative; flex-direction: column; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .app-header { background: rgba(15, 23, 42, 0.4); border-bottom: 1px solid rgba(148, 163, 184, 0.1); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .app-title { font-size: 16px; font-weight: 600; }
    .sync-status { font-size: 12px; padding: 4px 12px; background: rgba(59, 130, 246, 0.2); border-radius: 4px; color: #60a5fa; display: inline-flex; align-items: center; gap: 6px; }
    .sync-status.offline { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .profile-btn { background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .profile-btn:hover { background: rgba(59, 130, 246, 0.3); }
    .grid-container { flex: 1; overflow-y: auto; padding: 16px; }
    .day-row { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .day-header { display: grid; grid-template-columns: 60px 1fr 80px; gap: 12px; align-items: center; margin-bottom: 12px; font-weight: 500; }
    .day-date { font-size: 13px; color: #94a3b8; }
    .day-hours { font-size: 18px; font-weight: 600; color: #e0e7ff; }
    .day-note { font-size: 12px; color: #cbd5e1; margin-top: 8px; padding: 8px; background: rgba(15, 23, 42, 0.3); border-radius: 4px; }
    .channel-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .channel-pill { font-size: 11px; padding: 4px 10px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-radius: 12px; }
    .input-bar { position: sticky; bottom: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border-top: 1px solid rgba(148, 163, 184, 0.1); padding: 12px; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
    .input-bar input { margin: 0; }
    .input-bar button { padding: 10px 16px; height: 42px; font-size: 13px; cursor: pointer; }
    .toast { position: fixed; bottom: 20px; left: 20px; background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(148, 163, 184, 0.2); color: #e0e7ff; padding: 12px 16px; border-radius: 6px; font-size: 13px; z-index: 1000; animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { transform: translateX(-400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 768px) {
      .grid-container { padding: 12px; }
      .day-row { padding: 12px; }
      .day-header { grid-template-columns: 50px 1fr 70px; gap: 10px; }
      .day-hours { font-size: 16px; }
      .input-bar { padding: 10px; }
      .app-header { padding: 10px 12px; }
    }
  </style>
</head>
<body>

<!-- Login Gate -->
<div id="loginGate">
  <div class="login-card">
    <div id="loginForm">
      <div class="login-title">⏱️ Daily Time Tracker</div>
      <div class="login-subtitle">Sign in to sync your time across every device.</div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••" autocomplete="current-password">
      </div>
      <button class="btn" onclick="doSignIn()">Sign In</button>
      <div class="forgot-link"><a href="#" onclick="showForgotForm(event)">Forgot password?</a></div>
      <div id="statusMsg" class="status-msg"></div>
    </div>
    <div id="forgotPasswordForm" class="form-hidden">
      <div style="cursor: pointer; color: #3b82f6; margin-bottom: 16px;" onclick="showLoginForm()">← Back to Sign In</div>
      <div class="login-title">Reset Password</div>
      <div class="login-subtitle">Enter your email to receive a reset link.</div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="resetEmailInput" placeholder="you@example.com" autocomplete="email">
      </div>
      <button class="btn" onclick="doPasswordReset()">Send Reset Link</button>
      <div id="resetStatusMsg" class="status-msg"></div>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="appRoot">
  <div class="app-header">
    <div class="app-title">⏱️ Daily Time Tracker</div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <div id="syncIndicator" class="sync-status">🔄 Syncing</div>
      <button class="profile-btn" onclick="showProfiles()">👤 Profile</button>
      <button class="profile-btn" onclick="doSignOut()">Sign Out</button>
    </div>
  </div>
  <div class="grid-container" id="gridContainer"></div>
  <div class="input-bar">
    <input type="text" id="quickInput" placeholder="Add time or note for today..." onkeypress="handleQuickInput(event)">
    <button class="btn" style="width: auto;" onclick="toggleNoteEdit()">📝</button>
    <button class="btn" style="width: auto;" onclick="doSync()">💾</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.40.0/+esm';

const SUPA_URL = "https://vvybypeyzfgakenkotbw.supabase.co";
const SUPA_KEY = "sb_publishable_-aDVEq7DzlUz7hlvpgkUhw_i6yXO2SU";
const SB = createClient(SUPA_URL, SUPA_KEY, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"dtt-auth" }});

const DB_NAME = "DailyTimeTrackerDB";
let DB_VER = 1;
let db = null;

async function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = (e) => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains("profiles")) d.createObjectStore("profiles", {keyPath:"id"});
      if(!d.objectStoreNames.contains("channels")) d.createObjectStore("channels", {keyPath:"id"});
      if(!d.objectStoreNames.contains("sessions")) d.createObjectStore("sessions", {keyPath:"id"});
      if(!d.objectStoreNames.contains("plans")) d.createObjectStore("plans", {keyPath:"id"});
      if(!d.objectStoreNames.contains("day_notes")) d.createObjectStore("day_notes", {keyPath:"date"});
      if(!d.objectStoreNames.contains("selected_plan")) d.createObjectStore("selected_plan", {keyPath:"date"});
    };
    r.onsuccess = (e) => { db = e.target.result; resolve(db); };
    r.onerror = () => reject(r.error);
  });
}

async function idbGet(store, key) {
  return new Promise((resolve) => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
  });
}

async function idbSet(store, obj) {
  return new Promise((resolve) => {
    const tx = db.transaction(store, "readwrite");
    const req = tx.objectStore(store).put(obj);
    req.onsuccess = () => resolve(req.result);
  });
}

async function idbAll(store) {
  return new Promise((resolve) => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
  });
}

async function idbDel(store, key) {
  return new Promise((resolve) => {
    const tx = db.transaction(store, "readwrite");
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
  });
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function setSync(state) {
  const ind = document.getElementById("syncIndicator");
  ind.textContent = state === "syncing" ? "🔄 Syncing" : state === "offline" ? "⚠️ Offline" : "✅ Synced";
  ind.className = state === "offline" ? "sync-status offline" : "sync-status";
}

async function doSignIn() {
  const email = document.getElementById("emailInput").value;
  const pw = document.getElementById("passwordInput").value;
  if(!email || !pw) { document.getElementById("statusMsg").textContent = "Please fill in all fields"; return; }
  try {
    const { data, error } = await SB.auth.signInWithPassword({ email, password: pw });
    if (error) { document.getElementById("statusMsg").textContent = error.message; return; }
    window._acctEmail = email;
    await enterApp();
  } catch(e) { document.getElementById("statusMsg").textContent = "Sign in failed"; }
}

async function doPasswordReset() {
  const email = document.getElementById("resetEmailInput").value;
  if(!email) { document.getElementById("resetStatusMsg").textContent = "Please enter your email"; return; }
  try {
    const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "?recovery=true" });
    if(error) { document.getElementById("resetStatusMsg").textContent = error.message; return; }
    document.getElementById("resetStatusMsg").textContent = "Check your email for a reset link!";
    document.getElementById("resetStatusMsg").className = "status-msg success-msg";
    setTimeout(() => showLoginForm(), 3000);
  } catch(e) { document.getElementById("resetStatusMsg").textContent = "Reset failed"; }
}

function showForgotForm(e) {
  e.preventDefault();
  document.getElementById("loginForm").classList.add("form-hidden");
  document.getElementById("forgotPasswordForm").classList.remove("form-hidden");
}

function showLoginForm() {
  document.getElementById("forgotPasswordForm").classList.add("form-hidden");
  document.getElementById("loginForm").classList.remove("form-hidden");
  document.getElementById("resetStatusMsg").textContent = "";
  document.getElementById("resetStatusMsg").className = "status-msg";
}

async function enterApp() {
  document.getElementById("loginGate").style.display = "none";
  document.getElementById("appRoot").style.display = "flex";
  await seedIfEmpty();
  const last = await idbGet("meta", "lastProfile");
  const profs = await idbAll("profiles");
  const pid = (last && profs.find(p => p.id === last.v)) ? last.v : (profs[0] && profs[0].id);
  if(pid) await loadProfile(pid);
  setSync("syncing");
  runSync();
}

async function doSignOut() {
  await SB.auth.signOut();
  document.getElementById("loginGate").style.display = "flex";
  document.getElementById("appRoot").style.display = "none";
  document.getElementById("emailInput").value = "";
  document.getElementById("passwordInput").value = "";
}

async function seedIfEmpty() {
  let profs = await idbAll("profiles");
  if(profs.length === 0) {
    await idbSet("profiles", { id: "default", name: "My Profile", channels: [], active: true });
  }
}

async function handleQuickInput(e) {
  if(e.key !== "Enter") return;
  toast("Time entry saved");

}

async function doSync() {
  setSync("syncing");
  await new Promise(r => setTimeout(r, 500));
  setSync("synced");
}

(async function() {
  await openDB();
  const { data } = await SB.auth.getSession();
